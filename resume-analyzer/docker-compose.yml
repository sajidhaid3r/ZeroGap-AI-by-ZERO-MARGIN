version: "3.8"

services:
  resume-analyzer:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - resume_data:/data
    environment:
      - MAX_FILE_SIZE_BYTES=5242880
      - LOG_LEVEL=INFO
      - CORS_ALLOWED_ORIGINS=*
      # Uncomment and set to enable the LLM quality layer (rewrite
      # suggestions, leadership-signal judgment):
      # - ANTHROPIC_API_KEY=your_key_here
    restart: unless-stopped

volumes:
  resume_data:
