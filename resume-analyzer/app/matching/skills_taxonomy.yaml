# Skills taxonomy - seed dataset
# version: 1.0.0
#
# Structure mirrors how public taxonomies like ESCO (EU, esco.ec.europa.eu)
# and O*NET (US, onetonline.org) organize skills: a canonical skill name
# with a list of synonyms/abbreviations that should all resolve to it.
#
# This is a deliberately small SEED set covering common tech/business/soft
# skills, meant to be replaced or extended with the real ESCO or O*NET
# dataset in production (both are free/public). See
# `app/matching/taxonomy_loader.py` for an ESCO CSV importer you can point
# at the official ESCO skills download to replace this file at scale.
#
# category: "hard" | "soft" - used for the hard-skill vs soft-skill match
# breakdown in the job-tailoring check.

version: "1.0.0"

skills:
  # --- Programming languages / hard tech skills ---
  - canonical: Python
    category: hard
    synonyms: [python, python3, py]
  - canonical: JavaScript
    category: hard
    synonyms: [javascript, js, es6, ecmascript]
  - canonical: TypeScript
    category: hard
    synonyms: [typescript, ts]
